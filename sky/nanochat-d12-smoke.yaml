name: nanochat-d12-smoke

resources:
  cloud: aws
  region: us-east-1
  instance_type: g5.xlarge
  use_spot: false

workdir: .

envs:
  NANOCHAT_BASE_DIR: /outputs/skypilot/nanochat

file_mounts:
  /outputs:
    source: s3://gmstanle-nanochat
    mode: MOUNT

setup: |
  set -euo pipefail
  python3 -m pip install -U uv
  uv sync --extra gpu

run: |
  set -euo pipefail
  . .venv/bin/activate
  python -m nanochat.dataset -n 2
  python -m scripts.tok_train --max-chars=5000000 --vocab-size=8192
  python -m scripts.base_train \
    --depth=12 \
    --max-seq-len=512 \
    --device-batch-size=2 \
    --total-batch-size=4096 \
    --num-iterations=20 \
    --eval-every=-1 \
    --core-metric-every=-1 \
    --sample-every=-1 \
    --run=dummy
